name: Mirror to repo B

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Mirror repository (excluding .github)
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          # 完整克隆：浅克隆（--depth 1）配合 force push 在服务端会报
          # "did not receive expected object <sha>; index-pack failed" 而失败
          git clone https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} repo

          cd repo

          # Remove .github folder
          rm -rf .github

          # Configure target remote
          git remote set-url origin https://x-access-token:${MIRROR_TOKEN}@github.com/HNUDAO/HNUDAO-site.git

          # Commit the removal if there are changes
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Remove .github folder"

          # Force push branch to target
          git push --force origin HEAD

          # If triggered by a tag push, also push the tag
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            git fetch --tags origin
            git push --force origin "${{ github.ref }}"
          fi